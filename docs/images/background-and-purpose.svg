<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
<title>공공 웹사이트 불법광고 탐지: 개발 배경 및 목적</title>
<rect width="100%" height="100%" fill="white"/>
<text x="800.0" y="54" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#171717">공공 웹사이트 불법광고 탐지: 개발 배경 및 목적</text>
<text x="800" y="105" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" font-weight="400" fill="#444444">문제 상황 → 점검의 한계 → 개발 목표</text>
