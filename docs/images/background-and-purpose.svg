<polyline points="1010,305 1110,305" fill="none" stroke="#333333" stroke-width="2"/>
<polygon points="1110,305 1099.1946347717678,310.21958640933474 1099.1946347717678,299.78041359066526" fill="#333333"/>
<polyline points="1320,430 1320,475 800,475 800,520" fill="none" stroke="#333333" stroke-width="2"/>
<polygon points="800,520 794.7804135906653,509.1946347717679 805.2195864093347,509.1946347717679" fill="#333333"/>
<polyline points="250,520 1350,520 1350,625 250,625 250,520" fill="none" stroke="#333333" stroke-width="2"/>
<text x="800.0" y="572.5" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#171717">점검 사각지대 축소 · 수작업 점검 효율 향상</text>
