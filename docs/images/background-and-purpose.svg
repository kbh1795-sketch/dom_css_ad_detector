<text x="800" y="723" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#171717">예방적 대응의 필요성: 청소년 평생 도박 경험률 4.3%</text>
<text x="800" y="772" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#444444">출처: 한국도박문제예방치유원, 2024년 청소년 도박 실태조사</text>
<text x="800" y="810" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#555555">※ 청소년 도박 경험 통계이며, 공공 웹사이트의 광고 노출률을 의미하지 않음</text>
