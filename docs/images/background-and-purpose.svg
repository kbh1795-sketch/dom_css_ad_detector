<text x="280.0" y="310.0" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#333333">문자 변형 · 투명 처리</text>
<text x="280.0" y="350.0" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#333333">화면 밖 배치</text>
<polyline points="590,180 1010,180 1010,430 590,430 590,180" fill="none" stroke="#333333" stroke-width="2"/>
